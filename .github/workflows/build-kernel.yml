name: Build-Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vmlinux:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Fetch kernel source
        run: |
          curl -fL --retry 3 -o kernel-src.tgz \
            "https://github.com/zhllhappy/DirtyFragX/releases/download/kernel-src/kernel-src.tgz"
          ls -lh kernel-src.tgz
          tar -xzf kernel-src.tgz
          ls Code_Opensource/kernel | head

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev python3

      - name: Fetch Huawei's clang toolchain (r416183b1)
        run: |
          mkdir -p prebuilts/clang/host/linux-x86/clang-r416183b1
          curl -sSL --retry 3 \
            "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-20.0.tar.gz" \
            -o clang.tar.gz
          ls -lh clang.tar.gz
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r416183b1 --strip-components=1
          ls prebuilts/clang/host/linux-x86/clang-r416183b1/bin | head
          prebuilts/clang/host/linux-x86/clang-r416183b1/bin/clang --version | head -2

      - name: Configure
        run: |
          cd Code_Opensource/kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- merge_charlotte_defconfig

      - name: Inject huawei private include dirs
        run: |
          cd Code_Opensource/kernel
          python3 - <<'PYEOF'
          s = open('Makefile').read()
          anchor = 'LINUXINCLUDE += -I$(srctree)/mm'
          assert anchor in s, 'anchor not found'
          s = s.replace(anchor, 'LINUXINCLUDE += $(HW_INCS)\n' + anchor, 1)
          open('Makefile','w').write(s)
          print('LINUXINCLUDE patched')
          PYEOF

      - name: Build vmlinux
        run: |
          cd Code_Opensource/kernel
          # GCC/clang response file: thousands of -I args would blow ARG_MAX if
          # passed as one variable, but @file is expanded by the compiler itself.
          rm -f /tmp/incs.txt
          echo "-I$PWD/kernel/locking" > /tmp/incs.txt
          find . -name '*.h' -printf '%h\n' | sort -u | while IFS= read -r d; do
            case "$d" in ./include/linux|./include/asm-generic) continue;; esac
            echo "-I$PWD/${d#./}" >> /tmp/incs.txt
          done
          echo "include dirs: $(wc -l < /tmp/incs.txt)"
          python3 - <<'PYEOF'
          s = open('Makefile').read()
          anchor = 'LINUXINCLUDE += -I$(srctree)/mm'
          s = s.replace(anchor, 'LINUXINCLUDE += @/tmp/incs.txt\n' + anchor, 1)
          open('Makefile','w').write(s)
          print('LINUXINCLUDE += @/tmp/incs.txt')
          PYEOF
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux 2>&1 | tee /tmp/build.log
          grep -oE "'[^']+' file not found" /tmp/build.log | sort -u | head -40 || true

      - name: Save symbols
        run: |
          cd Code_Opensource/kernel
          ls -l vmlinux
          nm -n vmlinux | wc -l

      - uses: actions/upload-artifact@v7
        with:
          name: vmlinux
          path: |
            Code_Opensource/kernel/vmlinux
          if-no-files-found: error
